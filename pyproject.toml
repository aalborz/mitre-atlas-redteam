[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitre-atlas-redteam"
version = "0.1.0"
description = "Threat-modeling and red-team advisory CLI mapping systems to MITRE ATT&CK and MITRE ATLAS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "aalborz" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "platformdirs>=4",
    "mitreattack-python>=3.0",
    "anthropic>=0.40",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "respx", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
redatlas = "redatlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/redatlas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
